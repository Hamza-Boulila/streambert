services:
  streambert:
    build:
      context: .
      dockerfile: Dockerfile
    image: streambert-web:latest
    container_name: streambert-webapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Optional: Provide your TMDB JWT Read Access Token here to auto-authenticate
      # - TMDB_API_KEY=eyJ...
    volumes:
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
